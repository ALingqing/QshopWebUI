name: Release

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发行
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 读取版本号
        id: meta
        run: |
          raw="$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)"
          version="$(printf '%s' "$raw" | tail -n1 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::无法从 pom.xml 读取版本号"
            exit 1
          fi

          yml_version="$(sed -n 's/^version:[[:space:]]*//p' src/main/resources/plugin.yml | head -n1 | tr -d '[:space:]')"
          if [ "$yml_version" != "$version" ]; then
            echo "::error::plugin.yml 版本(${yml_version})与 pom.xml 版本(${version})不一致，请先同步两处版本号"
            exit 1
          fi

          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v${version}" ]; then
              echo "::error::标签 ${tag} 与 pom.xml 版本 ${version} 不一致，请在对应版本号的提交上打标签"
              exit 1
            fi
          fi

          # 测试版与正式版产物命名一致（QShopWebUI-<版本>.jar），仅通过 prerelease 标记区分
          files="target/QShopWebUI-*.jar"
          case "$version" in
            *-*)
              prerelease="true"
              title="QShopWebUI ${version}（测试版）"
              ;;
            *)
              prerelease="false"
              title="QShopWebUI v${version}"
              ;;
          esac

          enabled="true"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "dev" ] && [ "$prerelease" != "true" ]; then
            enabled="false"
            echo "::notice::dev 分支只发行测试版（版本号需带 -beta 等预发布后缀），本次跳过发行"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: 检查是否已发行
        id: check
        if: steps.meta.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 已存在则跳过
        if: steps.check.outputs.exists == 'true'
        run: echo "::notice::${{ steps.meta.outputs.tag }} 已存在，跳过构建与发行"

      - name: Maven 构建
        if: steps.check.outputs.exists == 'false'
        run: mvn -B package

      - name: 校验 JAR 内容
        if: steps.check.outputs.exists == 'false'
        run: node tools/verify-jar.mjs

      - name: 创建 Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: ${{ steps.meta.outputs.files }}
          generate_release_notes: true

      - name: 写入摘要
        run: |
          if [ "${{ steps.meta.outcome }}" != "success" ]; then
            echo "版本读取或校验失败，请查看上方步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.meta.outputs.enabled }}" != "true" ]; then
            echo "dev 分支只发行测试版（版本号需带 -beta 等后缀），本次跳过发行。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "版本 ${{ steps.meta.outputs.tag }} 已存在，本次跳过发行。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            echo "已创建预发布（测试版）${{ steps.meta.outputs.tag }}，附件 QShopWebUI-${{ steps.meta.outputs.version }}.jar。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "已创建发行版本 ${{ steps.meta.outputs.tag }}，附件为本次构建的 JAR。" >> "$GITHUB_STEP_SUMMARY"
          fi
