name: QShopWebUI
version: 1.0.0
main: com.qshop.webui.QShopWebUIPlugin
api-version: 1.17
description: QuickShop-Hikari 商店 Web 管理系统（单端口内嵌 Web UI，直接读取 QuickShop 数据）
author: QShop
website: https://github.com/
# QuickShop-Hikari 的插件名是 QuickShop；写成 softdepend 保证没有它时插件也能加载（显示空数据）
softdepend: [QuickShop, QuickShop-Hikari]
commands:
  qshopwebui:
    description: QShopWebUI 管理命令
    usage: /qshopwebui <reload|status|port <端口>>
    aliases: [qsw, qshopweb]
    permission: qshopwebui.admin
permissions:
  qshopwebui.admin:
    description: 允许管理 QShopWebUI
    default: op
