# ============================================================
# QShopWebUI — QuickShop-Hikari 商店网页系统
# ============================================================

# ------------------------------------------------------------
# 网站信息
# ------------------------------------------------------------
# 留空时使用默认值「Qshop 商店系统」。
# 显示位置：浏览器标题栏、顶部导航栏、首页大标题。
server-name: ""
# 显示在首页大标题下方，留空时使用默认值。
server-subtitle: ""

# ------------------------------------------------------------
# 网络与端口
# ------------------------------------------------------------
# standalone：浏览器访问 http://服务器IP:本端口/。
# multiplex：本端口同时作为游戏对外端口，插件自动分流网页和游戏流量。
# auto：port 等于当前游戏端口时使用 multiplex，否则使用 standalone。
#
# multiplex 模式要求将 server.properties 中的 server-port 改为另一个
# 容器内部端口（例如 25565），玩家仍使用原来的对外端口连接。
port: 12345
bind: 0.0.0.0
mode: auto

# multiplex 模式下，游戏流量转发到的实际地址。
# mc-port: 0 表示自动读取当前服务器端口（Bukkit.getPort()）。
mc-host: 127.0.0.1
mc-port: 0

# ------------------------------------------------------------
# 管理员账号
# ------------------------------------------------------------
# 用于登录网页后台。
# password 支持两种格式：
#   明文：   admin123
#   哈希：   sha256:<64位hex>
# 网页后台修改密码后会自动写入 sha256 格式。
admin:
  username: admin
  password: admin123

# 会话有效期，单位为秒。
session-timeout: 3600

# ------------------------------------------------------------
# 网页与 API
# ------------------------------------------------------------
web:
  # 单页最大条数，防止恶意大请求。
  max-page-size: 500
  default-page-size: 60
  # 请求体上限，单位为字节。
  max-body-size: 10485760
  # 是否将每个请求输出到控制台。
  access-log: false
  # 数据快照缓存时间，单位为毫秒。
  snapshot-ttl-ms: 5000

# ------------------------------------------------------------
# 在线购买
# ------------------------------------------------------------
# 玩家在线购买需要 Vault/经济插件。
purchase:
  enabled: true
  # 单次最多购买份数；1 份等于商店的 stacking_amount 个物品。
  max-amount: 64
  # 玩家不在线时是否允许下单（物品在玩家下次上线时自动发放）。
  allow-offline-buy: true
  # 玩家在游戏内执行 /qshopwebui code 后，将验证码填入网页。
  game-code-ttl-seconds: 300
  game-code-max-attempts: 5

# ------------------------------------------------------------
# 库存与经营（P1/P2 增强）
# ------------------------------------------------------------
shop:
  # 出售店剩余物品数低于该值时触发「库存不足」告警。
  stock-low-threshold: 10
  # 同一商店同类告警的冷却时间（毫秒），避免刷屏。
  alert-cooldown-ms: 300000
  # 在线交易连续失败超过该次数时，触发熔断保护（期间拒绝在线交易）。
  circuit-breaker-threshold: 8
  # 熔断持续时长（毫秒）。
  circuit-breaker-duration-ms: 300000
  # 订单流水最多保留条数（超出丢弃最旧）。
  order-max: 50000
  # 审计日志最多保留条数。
  audit-max: 5000

# ------------------------------------------------------------
# 通知（Webhook）
# ------------------------------------------------------------
# 留空 = 禁用通知推送。填 QQ 机器人 / 钉钉 / 企业微信 等 Webhook 地址。
# 库存告警、订单事件、经营异常会以 JSON POST 推送：
#   { "title": "...", "text": "...", "server": "服务器名" }
notifications:
  webhook-url: ""

# ------------------------------------------------------------
# 前台页面
# ------------------------------------------------------------
# true = 隐藏页面。
# 网页后台「数据管理」页可随时切换，后台设置优先于这里。
# 管理员登录后仍可查看被隐藏的页面。
pages:
  hide-home: false      # 首页（公告）
  hide-buy: false       # 购买界面
  hide-sell: false      # 收购界面
  hide-browse: false    # 物品浏览
  hide-shops: false     # 商店浏览
  hide-stats: false     # 信息统计

# ------------------------------------------------------------
# 调试
# ------------------------------------------------------------
# 是否在控制台打印 QuickShop 数据源状态。
debug: false
